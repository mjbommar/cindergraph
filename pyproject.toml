[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "cindergraph"
description = "Tolerant, deterministic C source analysis backed by Rust"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Michael Bommarito", email = "michael.bommarito@gmail.com" }]
keywords = ["C", "parser", "static analysis", "control flow", "data flow"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/mjbommar/cindergraph/blob/main/docs/README.md"
Issues = "https://github.com/mjbommar/cindergraph/issues"
Repository = "https://github.com/mjbommar/cindergraph"
Changelog = "https://github.com/mjbommar/cindergraph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
graphs = ["networkx>=3.0"]

[tool.maturin]
manifest-path = "crates/cindergraph-python/Cargo.toml"
python-source = "python"
module-name = "cindergraph._native"
features = ["extension-module"]
strip = true
include = [
  "python/cindergraph/py.typed",
  "python/cindergraph/_native/*.pyi",
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "EXTRACTION.md", format = "sdist" },
  { path = "docs/**/*.md", format = "sdist" },
  { path = "docs/benchmarks/data/*.json", format = "sdist" },
]

[dependency-groups]
dev = ["maturin>=1.9,<2.0", "networkx>=3.0", "pytest>=8.4", "ruff>=0.13", "ty>=0.0.1a20"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F403"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
  "core: requires only the installed extension",
  "slow: corpus-wide validation",
  "decbench: optional Joern differential; never run by default",
]
addopts = "-m 'not decbench'"
