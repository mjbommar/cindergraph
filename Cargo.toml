[workspace]
members = ["crates/cindergraph", "crates/cindergraph-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Michael Bommarito <michael.bommarito@gmail.com>"]
repository = "https://github.com/mjbommar/cindergraph"
documentation = "https://docs.rs/cindergraph"

[workspace.dependencies]
cindergraph = { path = "crates/cindergraph", version = "0.1.0" }
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
regex = "1.10"
serde_json = "1.0"
