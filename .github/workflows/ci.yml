name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check -p cindergraph --no-default-features
      - run: cargo package -p cindergraph --allow-dirty

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run maturin develop
      - run: uv run python tools/gen_native_stub.py --check
      - run: uv run pytest python/tests/
      - run: uv run ruff format --check python/
      - run: uv run ruff check python/
      - run: uv run ty check python/
